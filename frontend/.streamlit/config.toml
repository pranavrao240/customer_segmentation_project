[theme]
base = "dark"

primaryColor = "#6366F1"
backgroundColor = "#0A0E17"
secondaryBackgroundColor = "#121826"
textColor = "#F8FAFC"

font = "sans-serif"

borderColor = "rgba(255, 255, 255, 0.1)"
dataframeBorderColor = "rgba(255, 255, 255, 0.12)"
dataframeHeaderBackgroundColor = "#1E293B"

showWidgetBorder = true
showSidebarBorder = true

baseRadius = "0.75rem"
buttonRadius = "0.75rem"

[theme.sidebar]
backgroundColor = "#070A12"
secondaryBackgroundColor = "#101625"
textColor = "#F1F5F9"

primaryColor = "#818CF8"
borderColor = "rgba(255, 255, 255, 0.08)"